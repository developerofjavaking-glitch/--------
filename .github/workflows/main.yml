name: Build Tic Tac Toe APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Actions ট্যাব থেকে ম্যানুয়ালি রান করার অপশন

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Tic Tac Toe Code & Build APK
        run: |
          set -e

          # ১. ডিরেক্টরি তৈরি
          mkdir -p app/src/main/java/com/example/tictactoe

          # ২. settings.gradle তৈরি
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TicTacToe"
          include ':app'
          EOF

          # ৩. Root build.gradle তৈরি
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # ৪. app/build.gradle তৈরি
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.tictactoe'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.tictactoe"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          # ৫. AndroidManifest.xml তৈরি
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="Tic Tac Toe"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # ৬. Tic Tac Toe গেমের সম্পূর্ণ Java লজিক তৈরি
          cat << 'EOF' > app/src/main/java/com/example/tictactoe/MainActivity.java
          package com.example.tictactoe;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.GridLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private boolean isXTurn = true;
              private int movesCount = 0;
              private Button[][] buttons = new Button[3][3];
              private TextView statusTextView;
              private boolean gameOver = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER);
                  root.setBackgroundColor(Color.parseColor("#181825"));
                  root.setPadding(32, 32, 32, 32);

                  TextView titleView = new TextView(this);
                  titleView.setText("Tic Tac Toe");
                  titleView.setTextSize(32);
                  titleView.setTextColor(Color.WHITE);
                  titleView.setGravity(Gravity.CENTER);
                  titleView.setPadding(0, 0, 0, 24);
                  root.addView(titleView);

                  statusTextView = new TextView(this);
                  statusTextView.setText("Player X's Turn");
                  statusTextView.setTextSize(20);
                  statusTextView.setTextColor(Color.parseColor("#89B4FA"));
                  statusTextView.setGravity(Gravity.CENTER);
                  statusTextView.setPadding(0, 0, 0, 40);
                  root.addView(statusTextView);

                  GridLayout gridLayout = new GridLayout(this);
                  gridLayout.setRowCount(3);
                  gridLayout.setColumnCount(3);
                  gridLayout.setAlignmentMode(GridLayout.ALIGN_BOUNDS);

                  int btnSize = (int) (getResources().getDisplayMetrics().density * 90);

                  for (int i = 0; i < 3; i++) {
                      for (int j = 0; j < 3; j++) {
                          Button btn = new Button(this);
                          btn.setTextSize(34);
                          btn.setTextColor(Color.WHITE);
                          btn.setBackgroundColor(Color.parseColor("#313244"));
                          GridLayout.LayoutParams params = new GridLayout.LayoutParams();
                          params.width = btnSize;
                          params.height = btnSize;
                          params.setMargins(10, 10, 10, 10);
                          btn.setLayoutParams(params);

                          final int r = i;
                          final int c = j;
                          btn.setOnClickListener(new View.OnClickListener() {
                              @Override
                              public void onClick(View v) {
                                  onCellClicked(r, c);
                              }
                          });

                          buttons[i][j] = btn;
                          gridLayout.addView(btn);
                      }
                  }
                  root.addView(gridLayout);

                  Button resetBtn = new Button(this);
                  resetBtn.setText("Restart Game");
                  resetBtn.setTextSize(18);
                  resetBtn.setTextColor(Color.WHITE);
                  resetBtn.setBackgroundColor(Color.parseColor("#F38BA8"));
                  LinearLayout.LayoutParams resetParams = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.WRAP_CONTENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                  );
                  resetParams.setMargins(0, 50, 0, 0);
                  resetBtn.setLayoutParams(resetParams);
                  resetBtn.setPadding(40, 20, 40, 20);
                  resetBtn.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          resetGame();
                      }
                  });
                  root.addView(resetBtn);

                  setContentView(root);
              }

              private void onCellClicked(int r, int c) {
                  if (gameOver || !buttons[r][c].getText().toString().isEmpty()) {
                      return;
                  }

                  if (isXTurn) {
                      buttons[r][c].setText("X");
                      buttons[r][c].setTextColor(Color.parseColor("#A6E3A1"));
                  } else {
                      buttons[r][c].setText("O");
                      buttons[r][c].setTextColor(Color.parseColor("#FAB387"));
                  }
                  movesCount++;

                  if (checkWin()) {
                      gameOver = true;
                      String winner = isXTurn ? "Player X" : "Player O";
                      statusTextView.setText("🎉 " + winner + " Wins!");
                      statusTextView.setTextColor(Color.parseColor("#F9E2AF"));
                      Toast.makeText(this, winner + " Wins!", Toast.LENGTH_SHORT).show();
                      return;
                  }

                  if (movesCount == 9) {
                      gameOver = true;
                      statusTextView.setText("🤝 It's a Draw!");
                      statusTextView.setTextColor(Color.parseColor("#CDD6F4"));
                      Toast.makeText(this, "It's a Draw!", Toast.LENGTH_SHORT).show();
                      return;
                  }

                  isXTurn = !isXTurn;
                  statusTextView.setText(isXTurn ? "Player X's Turn" : "Player O's Turn");
              }

              private boolean checkWin() {
                  String[][] b = new String[3][3];
                  for (int i = 0; i < 3; i++) {
                      for (int j = 0; j < 3; j++) {
                          b[i][j] = buttons[i][j].getText().toString();
                      }
                  }

                  for (int i = 0; i < 3; i++) {
                      if (!b[i][0].isEmpty() && b[i][0].equals(b[i][1]) && b[i][1].equals(b[i][2])) return true;
                  }
                  for (int j = 0; j < 3; j++) {
                      if (!b[0][j].isEmpty() && b[0][j].equals(b[1][j]) && b[1][j].equals(b[2][j])) return true;
                  }
                  if (!b[0][0].isEmpty() && b[0][0].equals(b[1][1]) && b[1][1].equals(b[2][2])) return true;
                  if (!b[0][2].isEmpty() && b[0][2].equals(b[1][1]) && b[1][1].equals(b[2][0])) return true;

                  return false;
              }

              private void resetGame() {
                  for (int i = 0; i < 3; i++) {
                      for (int j = 0; j < 3; j++) {
                          buttons[i][j].setText("");
                      }
                  }
                  isXTurn = true;
                  movesCount = 0;
                  gameOver = false;
                  statusTextView.setText("Player X's Turn");
                  statusTextView.setTextColor(Color.parseColor("#89B4FA"));
              }
          }
          EOF

          # ৭. Gradle ডাউনলোড ও SDK License Accept করা
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

          # ৮. Debug APK বিল্ড করা
          ./gradle-8.5/bin/gradle assembleDebug

      # ৯. তৈরি হওয়া APK GitHub Artifact হিসেবে আপলোড করা
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TicTacToe-APK
          path: app/build/outputs/apk/debug/app-debug.apk
